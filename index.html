
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntramsScore | Official Scoreboard</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f5f9;
  color: #17243b;
}

header {
  background: linear-gradient(135deg, #071a35, #142f55);
  color: white;
  padding: 30px 18px;
  text-align: center;
  border-bottom: 5px solid #d6ad52;
}

header h1 {
  color: #e7c46e;
  font-size: 32px;
  letter-spacing: 2px;
}

header p {
  margin-top: 8px;
  color: #e1e6ef;
  font-size: 13px;
  letter-spacing: 2px;
}

.container {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

h2 {
  color: #10294b;
  margin-bottom: 15px;
  font-size: 20px;
}

h3 {
  color: #10294b;
  font-size: 16px;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d8dee8;
  border-radius: 8px;
  margin: 7px 0;
  font-size: 14px;
  background: white;
}

button {
  border: none;
  border-radius: 8px;
  padding: 11px 15px;
  cursor: pointer;
  font-weight: bold;
  margin: 4px 2px;
}

.gold {
  background: #d6ad52;
  color: #10213b;
}

.navy {
  background: #10294b;
  color: white;
}

.danger {
  background: #f4dddd;
  color: #a12b2b;
}

button:hover {
  opacity: .88;
}

.team-list, .event-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
}

.team-item, .event-item {
  border: 1px solid #e3e7ee;
  border-radius: 10px;
  padding: 14px;
}

.event-item {
  border-left: 4px solid #d6ad52;
}

.event-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.event-heading h3 {
  flex: 1;
}

.event-actions {
  display: flex;
  gap: 4px;
}

.small-btn {
  padding: 8px 10px;
  font-size: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 450px;
}

th, td {
  padding: 13px 10px;
  text-align: center;
  border-bottom: 1px solid #e5e8ef;
}

th {
  background: #10294b;
  color: #e7c46e;
}

tr:nth-child(even) {
  background: #f8f9fc;
}

.table-wrap {
  overflow-x: auto;
}

.rank {
  font-weight: bold;
  color: #b58a30;
}

.score {
  font-weight: bold;
  color: #10294b;
}

.empty {
  color: #7a8493;
  padding: 15px 0;
  text-align: center;
}

footer {
  background: #071a35;
  color: #d6ad52;
  text-align: center;
  padding: 20px;
  margin-top: 35px;
  font-size: 12px;
}

.label {
  font-size: 12px;
  color: #697589;
  margin-top: 8px;
  display: block;
}

@media(max-width:600px) {
  header h1 {
    font-size: 25px;
  }

  .card {
    padding: 15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>INTRAMSCORE</h1>
  <p>OFFICIAL SPORTS FESTIVAL SCOREBOARD</p>
</header>

<div class="container">

  <section class="card">
    <h2>🏆 Overall Leaderboard</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Total Points</th>
            <th>Events Won</th>
          </tr>
        </thead>
        <tbody id="leaderboard"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Team Management</h2>
    <div>
      <input id="teamName" placeholder="Enter new team name">
      <button class="gold" onclick="addTeam()">+ Add Team</button>
    </div>
    <div class="team-list" id="teamList"></div>
  </section>

  <section class="card">
    <h2>Sports and Events</h2>
    <input id="eventName" placeholder="Enter sport or event name">
    <button class="gold" onclick="addEvent()">+ Add Event</button>
    <div class="event-list" id="eventList"></div>
  </section>

  <section class="card">
    <h2>Scoring System</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Placement</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>1st Place</td><td>100</td></tr>
          <tr><td>2nd Place</td><td>75</td></tr>
          <tr><td>3rd Place</td><td>50</td></tr>
          <tr><td>4th Place</td><td>25</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</div>

<footer>
  INTRAMSCORE © 2026 | SPORTS FESTIVAL MANAGEMENT
</footer>

<script>
const STORAGE_KEY = "intramsScoreData";

let teams = [
  {id:1, name:"Team 1"},
  {id:2, name:"Team 2"},
  {id:3, name:"Team 3"},
  {id:4, name:"Team 4"}
];

let events = [
  {id:1, name:"Basketball Girls", places:{}},
  {id:2, name:"Basketball Boys", places:{}},
  {id:3, name:"Volleyball Boys", places:{}},
  {id:4, name:"Volleyball Girls", places:{}}
];

let nextTeam = 5;
let nextEvent = 5;

const points = {
  "1":100,
  "2":75,
  "3":50,
  "4":25
};

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    teams,
    events,
    nextTeam,
    nextEvent
  }));
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) {
      if (saved.teams) teams = saved.teams;
      if (saved.events) events = saved.events;
      nextTeam = saved.nextTeam || 5;
      nextEvent = saved.nextEvent || 5;
    }
  } catch(error) {
    console.log("Could not load saved data.");
  }
}

function addTeam() {
  const input = document.getElementById("teamName");
  const name = input.value.trim();

  if (!name) {
    alert("Please enter a team name.");
    return;
  }

  teams.push({id:nextTeam++, name});
  input.value = "";
  save();
  render();
}

function editTeam(id) {
  const team = teams.find(t => t.id === id);
  if (!team) return;

  const name = prompt("Enter the new team name:", team.name);

  if (name && name.trim()) {
    team.name = name.trim();
    save();
    render();
  }
}

function deleteTeam(id) {
  const team = teams.find(t => t.id === id);
  if (!team) return;

  if (!confirm("Delete " + team.name + "? Its recorded scores will also be removed.")) return;

  teams = teams.filter(t => t.id !== id);

  events.forEach(event => {
    delete event.places[id];
  });

  save();
  render();
}

function addEvent() {
  const input = document.getElementById("eventName");
  const name = input.value.trim();

  if (!name) {
    alert("Please enter an event name.");
    return;
  }

  events.push({
    id:nextEvent++,
    name,
    places:{}
  });

  input.value = "";
  save();
  render();
}

function editEvent(id) {
  const event = events.find(e => e.id === id);
  if (!event) return;

  const name = prompt("Edit sport or event name:", event.name);

  if (name && name.trim()) {
    event.name = name.trim();
    save();
    render();
  }
}

function deleteEvent(id) {
  if (!confirm("Delete this event and its scores?")) return;

  events = events.filter(e => e.id !== id);
  save();
  render();
}

function updatePlace(eventId, teamId, placement) {
  const event = events.find(e => e.id === eventId);
  if (!event) return;

  if (placement === "") {
    delete event.places[teamId];
  } else {
    const alreadyUsed = Object.entries(event.places)
      .some(([id, place]) =>
        id !== String(teamId) && place === placement
      );

    if (alreadyUsed) {
      alert("This placement is already assigned to another team.");
      render();
      return;
    }

    event.places[teamId] = placement;
  }

  save();
  render();
}

function getScores() {
  return teams.map(team => {
    let total = 0;
    let wins = 0;

    events.forEach(event => {
      const placement = event.places[team.id];

      if (placement) {
        total += points[placement] || 0;
        if (placement === "1") wins++;
      }
    });

    return {
      ...team,
      total,
      wins
    };
  }).sort((a,b) =>
    b.total - a.total || b.wins - a.wins
  );
}

function renderLeaderboard() {
  const tbody = document.getElementById("leaderboard");
  const scores = getScores();

  if (!scores.length) {
    tbody.innerHTML = '<tr><td colspan="4">No teams added yet.</td></tr>';
    return;
  }

  tbody.innerHTML = scores.map((team,index) => `
    <tr>
      <td class="rank">${index + 1}</td>
      <td>${escapeHTML(team.name)}</td>
      <td class="score">${team.total}</td>
      <td>${team.wins}</td>
    </tr>
  `).join("");
}

function renderTeams() {
  const container = document.getElementById("teamList");

  if (!teams.length) {
    container.innerHTML = '<p class="empty">No teams added.</p>';
    return;
  }

  container.innerHTML = teams.map(team => `
    <div class="team-item">
      <strong>${escapeHTML(team.name)}</strong>
      <div>
        <button class="gold small-btn" onclick="editTeam(${team.id})">Edit</button>
        <button class="danger small-btn" onclick="deleteTeam(${team.id})">Delete</button>
      </div>
    </div>
  `).join("");
}

function renderEvents() {
  const container = document.getElementById("eventList");

  if (!events.length) {
    container.innerHTML = '<p class="empty">No sports or events added yet.</p>';
    return;
  }

  container.innerHTML = events.map(event => `
    <div class="event-item">
      <div class="event-heading">
        <h3>${escapeHTML(event.name)}</h3>
        <div class="event-actions">
          <button class="gold small-btn" onclick="editEvent(${event.id})">Edit</button>
          <button class="danger small-btn" onclick="deleteEvent(${event.id})">Delete</button>
        </div>
      </div>

      ${
        teams.length
        ? teams.map(team => `
          <label class="label">${escapeHTML(team.name)}</label>
          <select onchange="updatePlace(${event.id}, ${team.id}, this.value)">
            <option value="" ${!event.places[team.id] ? "selected" : ""}>No placement</option>
            <option value="1" ${event.places[team.id] === "1" ? "selected" : ""}>1st Place - 100 points</option>
            <option value="2" ${event.places[team.id] === "2" ? "selected" : ""}>2nd Place - 75 points</option>
            <option value="3" ${event.places[team.id] === "3" ? "selected" : ""}>3rd Place - 50 points</option>
            <option value="4" ${event.places[team.id] === "4" ? "selected" : ""}>4th Place - 25 points</option>
          </select>
        `).join("")
        : '<p class="empty">Add teams to enter scores.</p>'
      }
    </div>
  `).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function render() {
  renderLeaderboard();
  renderTeams();
  renderEvents();
}

load();
render();
</script>

</body>
</html>
